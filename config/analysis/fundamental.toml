version = "fundamental-layer3-v1.0"
enabled = true
provider = "akshare_ths"

# 基本面层只负责排序或否决，不与技术分直接相加。
# AKShare同花顺摘要提供财务指标，东方财富业绩报表仅用于补精确公告日期。

[collection]
financial_top_n = 30
research_top_n = 10
quarters = 8
stale_after_days = 7

[scoring]
# 四项正向分先按85分权重归一为100，再减去最高15分的风险惩罚。
earnings_momentum_weight = 25
business_quality_weight = 20
industry_cycle_weight = 15
expectation_delta_weight = 25
risk_penalty_weight = 15
red_risk_threshold = 80
key_focus_threshold = 75
follow_up_threshold = 60
min_research_confidence = 0.60
